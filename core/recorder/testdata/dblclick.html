<!doctype html><html><head><meta charset="utf-8"><title>Double click</title></head><body style="font:14px sans-serif;margin:16px">
<h1>Double click</h1>
<div><button id="single">Single</button></div>
<div><button id="dbl" style="margin-top:40px">Double</button></div>
<pre id="out"></pre>
<script>
// The event sequence the page sees on #dbl, as "type:detail".
window.log = [];
for (const t of ['mousedown', 'mouseup', 'click', 'dblclick'])
  document.getElementById('dbl').addEventListener(t, (e) => { window.log.push(t + ':' + e.detail); out.textContent = window.log.join(' '); });
</script></body></html>
