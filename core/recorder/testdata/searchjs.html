<!doctype html><html><head><meta charset="utf-8"><title>Search script</title></head><body style="font:14px sans-serif;margin:16px">
<h1>Search</h1>
<form id="f" action="/results.html" role="search"><textarea id="q" name="q" role="combobox" aria-autocomplete="both" aria-label="Search" rows="1"></textarea></form>
<script>
// Like a big search page: the key handler stops the native action and changes
// location by script after a short delay.
var q = document.getElementById('q');
q.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' || e.code === 'Enter') {
    if (e.shiftKey) return;
    e.preventDefault();
    var v = q.value;
    setTimeout(function () { location.assign('/results.html?q=' + encodeURIComponent(v)); }, 150);
  }
});
</script></body></html>
