<!doctype html><html><head><meta charset="utf-8"><title>Dark</title>
<meta http-equiv="Content-Security-Policy" content="style-src 'nonce-ladi'">
<style nonce="ladi">
:root{color-scheme:dark}
html,body{margin:0;background:#0b1020;color:#e5e7eb;font:16px/1.5 Georgia,serif}
*{box-sizing:content-box;letter-spacing:.05em}
div,span,p,b{position:relative;display:block;float:none;width:auto;margin:4px 0;padding:0;font-size:18px;text-transform:uppercase}
button{display:block;width:100%;background:#e11d48;color:#000;font-size:20px;border:3px solid #f0f}
input{display:block;width:100%}
</style></head><body>
<h1>Dark page with global styles</h1>
<p>Overlay must not inherit any of this.</p>
<input id="q" placeholder="search"><button type="button">Page button</button>
</body></html>
